<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111411">
  <meta name="description" content="LeanBuild: home and gym workouts, exercise search, nutrition and body progress tracking.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>LeanBuild | Build steadily</title>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#" aria-label="LeanBuild home"><span class="brand-mark">L</span><span>LEAN<span class="brand-light">BUILD</span></span></a>
      <p class="eyebrow">YOUR PERSONAL TRAINER</p>
      <nav class="nav" aria-label="Main navigation">
        <button class="nav-link active" data-tab="overview"><span>◫</span> Overview</button>
        <button class="nav-link" data-tab="workouts"><span>↗</span> Workouts</button>
        <button class="nav-link" data-tab="nutrition"><span>◉</span> Nutrition</button>
        <button class="nav-link" data-tab="progress"><span>⌁</span> Progress</button>
        <button class="nav-link" data-tab="profile"><span>⚙</span> My targets</button>
        <button class="nav-link" data-tab="community"><span>♧</span> Community</button>
      </nav>
      <div class="sidebar-note"><span class="pulse"></span><div><strong>Small steps count.</strong><p>Show up, then level up.</p></div></div>
      <p class="side-foot">LEANBUILD · YOUR PACE</p>
    </aside>
    <main class="main">
      <header class="topbar">
        <div><p class="eyebrow" id="today-label">YOUR DAILY CHECK-IN</p><h1 id="page-title">Overview</h1></div>
        <div class="top-actions"><span class="date-chip" id="date-chip"></span><button class="avatar" id="user-avatar" data-user-profile title="Open your profile" aria-label="Open your profile">LB</button></div>
      </header>
      <div id="app-content" aria-live="polite"></div>
      <footer class="footer">Built for consistency, not perfection. <span>LeanBuild v1.1</span></footer>
    </main>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./supabase-config.js"></script>
  <script src="./app.js" defer></script>
  <script src="./community.js" defer></script>
</body>
</html>
